name: Build Android APK (Godot)

on:
  push:
    branches: [main, master]
    paths:
      - "godot/**"
      - ".github/workflows/godot-android.yml"
  workflow_dispatch:

jobs:
  build:
    name: Export APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot 4.7.2 and export templates
        run: |
          set -euo pipefail
          cd /tmp
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -oq godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          curl -sSL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates"
          unzip -oq templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates "$HOME/.local/share/godot/export_templates/4.7.2.stable"

      - name: Create signing keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Point Godot at the Android SDK and JDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Using Android SDK at $SDK"
          mkdir -p "$HOME/.config/godot"
          for name in editor_settings-4.tres editor_settings-4.7.tres; do
            cat > "$HOME/.config/godot/$name" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/shutdown_adb_on_exit = true
          EOF
          done

      - name: Export APK
        working-directory: godot
        run: |
          set -euo pipefail
          sed -i "s|^keystore/release=.*|keystore/release=\"$HOME/.android/debug.keystore\"|" export_presets.cfg
          sed -i "s|^keystore/release_user=.*|keystore/release_user=\"androiddebugkey\"|" export_presets.cfg
          sed -i "s|^keystore/release_password=.*|keystore/release_password=\"android\"|" export_presets.cfg
          sed -i "s|^keystore/debug=.*|keystore/debug=\"$HOME/.android/debug.keystore\"|" export_presets.cfg
          mkdir -p build
          GODOT=/tmp/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --import
          "$GODOT" --headless --path . --export-release "Android" build/LudoLegends.apk
          ls -la build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LudoLegends-apk
          path: godot/build/LudoLegends.apk
          if-no-files-found: error
